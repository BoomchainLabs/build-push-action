name: Boomchainlab Docker Build & Push
description: Build and push Docker images using Buildx with support for multi-arch and custom tags.
author: boomchainlab
branding:
  icon: anchor
  color: blue

inputs:
  context:
    description: Path to the build context (default: .)
    required: false
    default: '.'
  file:
    description: Path to the Dockerfile (default: Dockerfile)
    required: false
    default: Dockerfile
  platforms:
    description: Target platforms (e.g., linux/amd64,linux/arm64)
    required: false
    default: linux/amd64
  push:
    description: Push to registry (true/false)
    required: false
    default: true
  tags:
    description: Comma-separated list of image tags
    required: true
  build-args:
    description: Optional build arguments
    required: false
    default: ''
  cache-from:
    description: External cache sources
    required: false
  cache-to:
    description: External cache destinations
    required: false

runs:
  using: composite
  steps:
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to Docker registry
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Build and push image
      uses: docker/build-push-action@v5
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        push: ${{ inputs.push }}
        platforms: ${{ inputs.platforms }}
        tags: ${{ inputs.tags }}
        build-args: ${{ inputs.build-args }}
        cache-from: ${{ inputs.cache-from }}
        cache-to: ${{ inputs.cache-to }}
