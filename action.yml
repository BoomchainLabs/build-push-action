# action.yml
name: 'Docker Build & Push'
description: 'Build and push Docker images using Docker Buildx'
author: 'docker'
branding:
  icon: 'anchor'
  color: 'blue'

inputs:
  context:
    description: 'Path to the build context'
    required: true
    default: '.'
  file:
    description: 'Path to the Dockerfile'
    required: false
    default: './Dockerfile'
  platforms:
    description: 'Comma-separated list of target platforms (e.g., linux/amd64,linux/arm64)'
    required: false
  push:
    description: 'Push image to registry (true/false)'
    required: false
    default: 'false'
  tags:
    description: 'Comma-separated list of tags (e.g., user/app:latest,user/app:v1)'
    required: true
  build-args:
    description: 'Comma-separated list of build args (e.g., FOO=bar,HELLO=world)'
    required: false
  github-token:
    description: 'GitHub Token (for private submodules or context auth)'
    default: ${{ github.token }}
    required: false

outputs:
  imageid:
    description: 'Built image ID'
  digest:
    description: 'Image digest'
  metadata:
    description: 'Metadata from the build'

runs:
  using: 'node20'
  main: 'dist/index.js'
  post: 'dist/index.js'
